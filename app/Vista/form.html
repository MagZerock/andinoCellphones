<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Add CellPhone</title>
    <link rel="stylesheet" href="../../public/css/index.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar__container">
            <span class="navbar__logo">Cellphone System</span>
            <ul class="navbar__menu">
                <li><a href="../Controller/viewCellPhones.php">View Cellphones</a></li>
				<li><a href="./form.html" class="active">Add CellPhone</a></li>
            </ul>
        </div>
    </nav>
    <h1>Add New CellPhone</h1>
    <form action="../Controller/addCellPhone.php" method="POST">
        <div>
            <label>Brand:</label>
            <input type="text" name="brand" required>
        </div>
        <div>
            <label>Model:</label>
            <input type="text" name="model" required>
        </div>
        <div>
            <label>Price:</label>
            <input type="number" step="0.01" name="price" required>
        </div>
        <div>
            <label>Screen:</label>
            <input type="text" name="screen" required>
        </div>
        <div>
            <label>RAM:</label>
            <input type="text" name="ram" required>
        </div>
        <div>
            <label>Storage:</label>
            <input type="text" name="storage" required>
        </div>
        <div>
            <label>Camera:</label>
            <input type="text" name="camera" required>
        </div>
        <div>
            <label>Battery:</label>
            <input type="text" name="battery" required>
        </div>
        <button type="submit">Save Cellphone</button>
    </form>
</body>
</html>
